<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="ZhouXiang 周想">
<meta name="copyright" content="ZhouXiang 周想">
<title>HD6002 AI Ethics & Governance — Study Hub</title>
<style>
/* ================================================================ */
/*                      DESIGN SYSTEM v4                             */
/* ================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:            #f5f6f8;
  --surface:       rgba(255,255,255,0.7);
  --surface-solid: #ffffff;

  --text:          #1e293b;
  --text-soft:     #475569;
  --text-muted:    #94a3b8;

  --blue:          #4F8CFF;
  --blue-bg:       rgba(79,140,255,0.1);
  --blue-border:   rgba(79,140,255,0.28);

  --green:         #22C55E;
  --green-bg:      rgba(34,197,94,0.1);
  --green-border:  rgba(34,197,94,0.28);

  --amber:         #F59E0B;
  --amber-bg:      rgba(245,158,11,0.1);
  --amber-border:  rgba(245,158,11,0.28);

  --red:           #EF4444;
  --red-bg:        rgba(239,68,68,0.1);
  --red-border:    rgba(239,68,68,0.28);

  --purple:        #8B5CF6;
  --purple-bg:     rgba(139,92,246,0.1);
  --purple-border: rgba(139,92,246,0.28);

  --teal:          #14B8A6;
  --teal-bg:       rgba(20,184,166,0.1);
  --teal-border:   rgba(20,184,166,0.28);

  --slate:         #64748B;
  --slate-bg:      rgba(100,116,139,0.08);
  --slate-border:  rgba(100,116,139,0.2);

  --radius:        20px;
  --radius-sm:     14px;
  --radius-xs:     10px;

  --glass-bg:      rgba(255,255,255,0.62);
  --glass-border:  rgba(255,255,255,0.45);
  --glass-blur:    20px;
  --glass-shadow:  0 2px 16px rgba(0,0,0,0.04);
  --glass-hover:   0 8px 32px rgba(0,0,0,0.07);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  --transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}

body {
  font-family: var(--font);
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(79,140,255,0.06) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.05) 0%, transparent 50%);
  color: var(--text);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

.container { max-width: 1000px; margin: 0 auto; padding: 32px 24px 80px; }

.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--glass-shadow);
  transition: var(--transition);
}
.glass:hover { transform: translateY(-1px) scale(1.004); box-shadow: var(--glass-hover); }

/* ============================ HEADER ============================ */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 28px; margin-bottom: 22px;
  flex-wrap: wrap; gap: 14px;
}
.header-left h1 {
  font-size: 21px; font-weight: 700; letter-spacing: -0.3px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header-left .sub { font-size: 12.5px; color: var(--text-soft); margin-top: 4px; }
.header-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.progress-ring {
  width: 54px; height: 54px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  color: var(--blue); border: 3px solid var(--blue);
  background: var(--blue-bg);
  transition: var(--transition);
}

.btn {
  padding: 9px 18px; border-radius: 24px; border: 1px solid var(--slate-border);
  background: rgba(255,255,255,0.7); color: var(--text-soft); font-size: 13px;
  cursor: pointer; font-family: var(--font); font-weight: 500;
  transition: var(--transition);
}
.btn:hover { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); transform: translateY(-1px); box-shadow: 0 4px 16px var(--blue-bg); }
.btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 20px; }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-primary:hover { background: #3b7bf0; color: #fff; }

/* Language toggle */
.lang-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
  border: 1.5px solid var(--blue); color: var(--blue); background: var(--blue-bg);
  cursor: pointer; font-family: var(--font); transition: var(--transition);
}
.lang-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px var(--blue-bg); }

/* ============================ HERO ============================ */
.hero { margin-bottom: 22px; padding: 30px; position: relative; overflow: hidden; }
.hero::before {
  content: ''; position: absolute; top: -40px; right: -40px;
  width: 180px; height: 180px; border-radius: 50%;
  background: radial-gradient(circle, rgba(79,140,255,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 14px; border-radius: 20px;
  background: var(--blue-bg); color: var(--blue);
  font-size: 12px; font-weight: 600; margin-bottom: 14px;
}
.hero-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
.hero-title { font-size: 25px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
.hero-sub { font-size: 14px; color: var(--text-soft); margin-bottom: 22px; }

.hero-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.hero-step {
  background: rgba(255,255,255,0.55);
  border: 1px solid rgba(255,255,255,0.55);
  border-radius: var(--radius-sm); padding: 20px;
  cursor: pointer; transition: var(--transition);
  position: relative;
}
.hero-step:hover { transform: translateY(-2px) scale(1.03); box-shadow: var(--glass-hover); background: rgba(255,255,255,0.8); }
.hero-step .step-num {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; margin-bottom: 10px; color: #fff;
}
.hero-step .step-num.s1 { background: var(--blue); }
.hero-step .step-num.s2 { background: var(--green); }
.hero-step .step-num.s3 { background: var(--amber); }
.hero-step .step-num.s4 { background: var(--purple); }
.hero-step h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
.hero-step p { font-size: 12px; color: var(--text-soft); line-height: 1.5; }
.hero-step .step-check {
  position: absolute; top: 16px; right: 16px;
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid #cbd5e1; display: flex;
  align-items: center; justify-content: center; font-size: 11px;
  color: transparent; transition: var(--transition);
}
.hero-step .step-check.checked { background: var(--green); border-color: var(--green); color: #fff; }

/* ============================ DROPZONE ============================ */
.dropzone-wrap { margin-bottom: 22px; }
.dropzone {
  border: 2px dashed #cbd5e1;
  border-radius: var(--radius); padding: 28px 24px;
  text-align: center; cursor: pointer; position: relative;
}
.dropzone.drag-over { border-color: var(--blue); background: var(--blue-bg); }
.dropzone-icon { font-size: 34px; margin-bottom: 8px; }
.dropzone-title { font-size: 15px; font-weight: 600; }
.dropzone-hint { font-size: 13px; color: var(--text-soft); margin-top: 6px; }
.dropzone-feedback {
  margin-top: 14px; padding: 12px 18px; border-radius: var(--radius-xs);
  font-size: 13px; display: none; white-space: pre-line;
}
.dropzone-feedback.success { display: block; background: var(--green-bg); color: #15803d; border: 1px solid var(--green-border); }
.dropzone-feedback.error { display: block; background: var(--red-bg); color: #b91c1c; border: 1px solid var(--red-border); }
.dropzone-feedback.info { display: block; background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border); }

/* ============================ DASHBOARD ============================ */
.dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
@media (max-width: 760px) { .dashboard { grid-template-columns: 1fr; } }

.card-title {
  font-size: 13px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.8px; color: var(--text-soft); margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.card-body { padding: 22px; }

.assessment-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1px solid rgba(0,0,0,0.05);
  font-size: 13px;
}
.assessment-item:last-child { border-bottom: none; }
.assessment-item .name { font-weight: 500; }
.assessment-item .pct { font-weight: 700; font-size: 14px; color: var(--blue); }
.assessment-item .meta { color: var(--text-muted); font-size: 11px; }

.milestone { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; font-size: 13px; }
.milestone-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.milestone-dot.warn { background: var(--amber); }
.milestone-dot.danger { background: var(--red); }
.milestone-dot.info { background: var(--blue); }
.milestone-week { font-weight: 600; }
.milestone-desc { color: var(--text-soft); font-size: 12px; }

/* ============================ MATERIALS GRID ============================ */
.materials-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
  gap: 10px;
}
.material-cell {
  aspect-ratio: 1; border-radius: var(--radius-xs);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 11px; text-align: center; cursor: pointer;
  border: 1px solid #e2e8f0;
  background: #fff;
  transition: var(--transition); padding: 4px; gap: 2px;
}
.material-cell:hover { transform: scale(1.08); border-color: var(--blue); background: var(--blue-bg); }
.material-cell .week-num { font-weight: 700; font-size: 16px; color: var(--text); }
.material-cell .week-label { color: var(--text-muted); font-size: 10px; }

.material-cell.full { border-color: var(--green-border); background: var(--green-bg); }
.material-cell.full .week-num { color: var(--green); }
.material-cell.partial { border-color: var(--amber-border); background: var(--amber-bg); }
.material-cell.partial .week-num { color: var(--amber); }
.material-cell.key { border-color: var(--red-border); background: var(--red-bg); }
.material-cell.key .week-num { color: var(--red); }
.material-cell.key.full { border-color: var(--purple-border); background: var(--purple-bg); }
.material-cell.key.full .week-num { color: var(--purple); }
.material-cell.has-notes::after {
  content: '📝'; position: absolute; bottom: 2px; right: 4px; font-size: 9px;
}

/* ============================ ILO ============================ */
.ilo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.ilo-chip {
  padding: 13px 15px; border-radius: var(--radius-sm);
  font-size: 12px; line-height: 1.5; transition: var(--transition);
}
.ilo-chip:hover { transform: translateY(-1px) scale(1.02); }
.ilo-chip strong { font-size: 13px; display: block; margin-bottom: 3px; }
.ilo-1 { background: var(--blue-bg); border: 1px solid var(--blue-border); }
.ilo-1 strong { color: var(--blue); }
.ilo-2 { background: var(--green-bg); border: 1px solid var(--green-border); }
.ilo-2 strong { color: #15803d; }
.ilo-3 { background: var(--amber-bg); border: 1px solid var(--amber-border); }
.ilo-3 strong { color: #b45309; }
.ilo-4 { background: var(--purple-bg); border: 1px solid var(--purple-border); }
.ilo-4 strong { color: var(--purple); }
.ilo-5 { background: var(--red-bg); border: 1px solid var(--red-border); }
.ilo-5 strong { color: var(--red); }

/* ============================ WEEK SECTIONS ============================ */
.week-section {
  margin-bottom: 14px; overflow: hidden;
  border-radius: var(--radius);
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  transition: var(--transition);
}
.week-section:hover { box-shadow: var(--glass-hover); }

.week-header { display: flex; align-items: center; padding: 18px 22px; cursor: pointer; user-select: none; transition: background 0.2s; }
.week-header:hover { background: rgba(255,255,255,0.25); }
.week-badge {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; margin-right: 14px; flex-shrink: 0;
  color: #fff;
}
.week-badge.active { background: var(--blue); }
.week-badge.key { background: var(--red); }
.week-badge.collected { background: var(--green); }
.week-badge.partial-bg { background: var(--amber); }
.week-badge.default { background: #cbd5e1; color: var(--text-soft); }

.week-info { flex: 1; }
.week-info .topic { font-weight: 600; font-size: 15px; }
.week-info .flags { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
.flag { font-size: 10px; padding: 3px 10px; border-radius: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
.flag.quiz { background: var(--red-bg); color: #b91c1c; }
.flag.paper { background: var(--amber-bg); color: #b45309; }
.flag.pres { background: var(--purple-bg); color: #7c3aed; }
.flag.case { background: var(--blue-bg); color: #2563eb; }
.flag.warn { background: var(--teal-bg); color: #0f766e; }
.week-toggle { font-size: 14px; color: var(--text-muted); transition: transform 0.35s cubic-bezier(0.25, 0.1, 0.25, 1); }
.week-section.expanded .week-toggle { transform: rotate(180deg); }
.week-body { display: none; padding: 0 22px 22px; }
.week-section.expanded .week-body { display: block; }

/* ============================ WEEK FILES (single area) ============================ */
.week-files {
  margin: 16px 0 4px;
  border: 1.5px dashed #cbd5e1; border-radius: var(--radius-sm);
  padding: 14px 16px; background: rgba(255,255,255,0.4);
  transition: var(--transition);
}
.week-files.drag-over { border-color: var(--blue); background: var(--blue-bg); }
.week-files-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.week-files-title { font-size: 12.5px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 6px; }
.week-files-count { font-size: 11.5px; color: var(--green); font-weight: 600; }
.week-files-list { display: flex; flex-direction: column; gap: 4px; max-height: 160px; overflow-y: auto; margin-bottom: 6px; }
.week-file-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 10px; border-radius: 8px;
  font-size: 12px; background: rgba(255,255,255,0.5);
  transition: background 0.15s;
}
.week-file-item:hover { background: rgba(0,0,0,0.05); }
.week-file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-size: 12px; }
.week-file-remove {
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: var(--text-muted); cursor: pointer;
  flex-shrink: 0; font-weight: 600; transition: var(--transition);
}
.week-file-remove:hover { background: var(--red-bg); color: var(--red); }
.week-files-add {
  display: block; width: 100%; padding: 7px; border-radius: 10px;
  border: 1px dashed var(--slate-border); background: transparent;
  font-size: 12px; color: var(--text-muted); cursor: pointer;
  font-family: var(--font); transition: var(--transition);
}
.week-files-add:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); }
.week-files-empty { font-size: 12px; color: var(--text-muted); padding: 4px 0 8px; }

/* ============================ MODULE TABS ============================ */
.module-tabs {
  display: flex; gap: 8px; margin: 18px 0 14px;
  padding: 6px; background: rgba(255,255,255,0.45);
  border: 1px solid rgba(0,0,0,0.05);
  border-radius: 16px; overflow-x: auto; flex-wrap: wrap;
}
.tab-btn {
  flex: 1; min-width: 120px; padding: 10px 12px;
  border: none; border-radius: 12px;
  background: transparent; color: var(--text-soft);
  font-size: 13px; font-weight: 600; cursor: pointer;
  font-family: var(--font); transition: var(--transition);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.tab-btn:hover { background: rgba(255,255,255,0.7); color: var(--text); transform: translateY(-1px); }
.tab-btn.active { background: var(--blue); color: #fff; box-shadow: 0 4px 14px var(--blue-bg); }
.tab-btn .tab-ico { font-size: 15px; }
.tab-btn.has-content::after {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); margin-left: 2px;
}

.module-panel { display: none; animation: fadeIn 0.3s ease; }
.module-panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ============================ WEEK 1 CONTENT ============================ */
.w1-section {
  margin-bottom: 18px;
  padding: 18px 20px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.45);
  border: 1px solid rgba(0,0,0,0.06);
}
.w1-section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.w1-section-num {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; color: #fff; flex-shrink: 0;
}
.w1-section-num.s1 { background: var(--blue); }
.w1-section-num.s2 { background: var(--green); }
.w1-section-num.s3 { background: var(--amber); }
.w1-section-num.s4 { background: var(--purple); }
.w1-section-header h3 { font-size: 16px; font-weight: 600; }
.w1-section-header p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.exercise-table { width: 100%; font-size: 13px; border-collapse: collapse; margin: 8px 0 14px; }
.exercise-table th, .exercise-table td { border: 1px solid #e2e8f0; padding: 9px 12px; text-align: left; }
.exercise-table th { background: #f8fafc; font-weight: 600; font-size: 12px; color: var(--text-soft); }
.exercise-table td { font-size: 12px; }
.exercise-table .answer { background: var(--green-bg); font-weight: 700; color: #15803d; font-family: "SF Mono", "Fira Code", monospace; text-align: center; }

.layer-stack { margin: 12px 0 14px; }
.layer { padding: 15px 17px; border-radius: var(--radius-sm); margin-bottom: 8px; font-size: 13px; line-height: 1.5; transition: var(--transition); }
.layer:hover { transform: translateX(2px); }
.layer-1 { background: var(--blue-bg); border-left: 4px solid var(--blue); }
.layer-2 { background: var(--green-bg); border-left: 4px solid var(--green); }
.layer-3 { background: var(--amber-bg); border-left: 4px solid var(--amber); }
.layer-4 { background: var(--purple-bg); border-left: 4px solid var(--purple); }
.layer-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.layer-desc { color: var(--text-soft); font-size: 12px; }

.comp-table { width: 100%; font-size: 12px; border-collapse: collapse; margin: 8px 0 12px; }
.comp-table th, .comp-table td { border: 1px solid #e2e8f0; padding: 9px 12px; text-align: left; }
.comp-table th { background: #f8fafc; font-weight: 600; font-size: 11px; color: var(--text-soft); }
.comp-table td { vertical-align: top; }
.comp-table tr:hover td { background: rgba(248,250,252,0.5); }

.reading-card { background: rgba(255,255,255,0.5); border: 1px solid #e2e8f0; border-radius: var(--radius-sm); padding: 13px 15px; margin-bottom: 8px; }
.reading-card h5 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.reading-card p { font-size: 12px; color: var(--text-soft); }

.insight-box {
  padding: 11px 15px; border-radius: var(--radius-xs);
  background: rgba(255,255,255,0.55); border: 1px solid #e2e8f0;
  font-size: 12px; color: var(--text-soft); margin: 8px 0;
}
.sub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.sub-card { padding: 10px 12px; border-radius: 10px; font-size: 12px; border: 1px solid transparent; }
.sub-card.blue { background: var(--blue-bg); border-color: var(--blue-border); }
.sub-card.green { background: var(--green-bg); border-color: var(--green-border); }
.sub-card.amber { background: var(--amber-bg); border-color: var(--amber-border); }
.sub-card.purple { background: var(--purple-bg); border-color: var(--purple-border); }
.sub-card.red { background: var(--red-bg); border-color: var(--red-border); }
.sub-card strong { display: block; margin-bottom: 2px; }

/* ============================ QUIZ ============================ */
.quiz-banner {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  padding: 13px 16px; border-radius: var(--radius-sm);
  background: var(--purple-bg); border: 1px solid var(--purple-border);
  margin-bottom: 16px;
}
.quiz-banner-text { font-size: 13px; color: var(--text); }
.quiz-banner-text strong { color: var(--purple); }
.quiz-score { font-size: 13px; font-weight: 700; color: var(--purple); }

.mcq-q {

const STORAGE_KEY = 'hd6002_studyhub';
const LANG_KEY = 'hd6002_lang';

function getDefaultState() {
  const s = {
    materials: {}, notes: {}, stepCompletion: {},
    activeTabs: {}, quizState: {},
    lang: localStorage.getItem(LANG_KEY) || 'zh',
    lastUpdated: new Date().toISOString()
  };
  for (let w = 1; w <= 13; w++) {
    s.materials[w] = { files: [] };
    s.notes[w] = '';
  }
  return s;
}

function migrateSlot(slot) {
  if (!slot) return [];
  if (Array.isArray(slot.files)) return slot.files;              // new array format
  if (slot.collected && slot.filename) return [{ filename: slot.filename }]; // oldest format
  return [];
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const state = JSON.parse(raw);
      for (let w = 1; w <= 13; w++) {
        const m = state.materials[w];
        if (!m) { state.materials[w] = { files: [] }; }
        else if (Array.isArray(m.files)) { /* already new */ }
        else {
          // flatten slides / reading1 / reading2 (new-old multi-slot) into one list
          const all = [];
          ['slides', 'reading1', 'reading2'].forEach(slot => {
            if (m[slot]) all.push(...migrateSlot(m[slot]));
          });
          state.materials[w] = { files: all };
        }
        if (!state.notes[w]) state.notes[w] = '';
      }
      if (!state.stepCompletion) state.stepCompletion = {};
      if (!state.activeTabs) state.activeTabs = {};
      if (!state.quizState) state.quizState = {};
      if (!state.lang) state.lang = localStorage.getItem(LANG_KEY) || 'zh';
      return state;
    }
  } catch(e) { console.error('State load error:', e); }
  return getDefaultState();
}

let appState = loadState();
let lang = appState.lang || 'zh';

function saveState() {
  appState.lastUpdated = new Date().toISOString();
  appState.lang = lang;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  localStorage.setItem(LANG_KEY, lang);
}

function getWeekFromFilename(filename) {
  const name = filename.toLowerCase();
  let m = name.match(/week\s*[_.-]?\s*(\d+)/i);
  if (m) return parseInt(m[1]);
  m = name.match(/\bw(\d+)\b/i);
  if (m) return parseInt(m[1]);
  return null;
}

function addFileToWeek(weekNum, filename, silent) {
  if (!appState.materials[weekNum]) appState.materials[weekNum] = { files: [] };
  const list = appState.materials[weekNum].files;
  if (list.some(f => f.filename === filename)) {
    if (!silent) showToast(t('dupToast').replace('{f}', filename));
    return false;
  }
  list.push({ filename: filename });
  saveState();
  if (!silent) showToast(t('addedToast').replace('{f}', filename).replace('{w}', weekNum));
  return true;
}

function handleFiles(fileList) {
  const feedback = document.getElementById('dropFeedback');
  if (!fileList || fileList.length === 0) return;
  const messages = [];
  let anySuccess = false, anyFail = false;
  for (const file of fileList) {
    const wk = getWeekFromFilename(file.name);
    if (!wk || wk < 1 || wk > 13) {
      messages.push('⚠️ "' + file.name + '" ' + (lang === 'zh' ? '无法识别周次，请确认文件名含 Week X' : 'week not recognised — filename should contain "Week X"'));
      anyFail = true;
    } else if (addFileToWeek(wk, file.name, true)) {
      messages.push('✅ "' + file.name + '" → Week ' + wk);
      anySuccess = true;
    } else {
      anyFail = true;
    }
  }
  feedback.className = 'dropzone-feedback ' + (anySuccess ? (anyFail ? 'info' : 'success') : 'error');
  feedback.textContent = messages.join('\n');
  feedback.style.display = 'block';
  setTimeout(() => { feedback.style.display = 'none'; }, 5000);
  refreshAll();
}

function filesOf(w) { return (appState.materials[w] && appState.materials[w].files) || []; }
function getWeekCompletion(w) {
  const week = WEEKS.find(x => x.num === w);
  const n = filesOf(w).length;
  if (n === 0) return 'empty';
  if (n >= (week ? week.expected : 1)) return 'full';
  return 'partial';
}
function isKeyWeek(w) { return KEY_WEEKS.includes(w); }
function getCollectedCount() {
  let c = 0;
  for (let w = 1; w <= 13; w++) c += filesOf(w).length > 0 ? 1 : 0;
  return c;
}

// ---------------- WEEK SECTIONS ----------------
function renderWeekSections() {
  const container = document.getElementById('weekSections');
  container.innerHTML = '';
  WEEKS.forEach(w => container.appendChild(renderWeekSection(w)));
  bindLangBtn();
}

function renderWeekSection(week) {
  const section = document.createElement('div');
  section.className = 'week-section' + (week.num === 1 ? ' expanded' : '');
  section.id = 'week-' + week.num;

  const completion = getWeekCompletion(week.num);
  let badgeClass = getWeekBadgeClass(week.num);
  let badgeContent = week.num;
  if (completion === 'full') badgeContent = '✓';

  const flags = week.flags.map(f =>
    '<span class="flag ' + FLAG_KEYS[f] + '">' + flagText(f, week) + '</span>'
  ).join('');

  const header = document.createElement('div');
  header.className = 'week-header';
  header.onclick = function() {
    section.classList.toggle('expanded');
    if (section.classList.contains('expanded')) hydrateNotes(week.num, section);
  };
  header.innerHTML =
    '<div class="week-badge ' + badgeClass + '">' + badgeContent + '</div>' +
    '<div class="week-info">' +
    '  <div class="topic">Week ' + week.num + ': ' + weekTopic(week) + '</div>' +
    '  <div class="flags">' + flags + '</div>' +
    '</div>' +
    '<div class="week-toggle">▼</div>';
  section.appendChild(header);

  const body = document.createElement('div');
  body.className = 'week-body';
  body.appendChild(renderWeekFiles(week));
  body.appendChild(renderModuleTabs(week));
  body.appendChild(renderModulePanels(week));
  body.appendChild(renderNotesBlock(week.num));
  section.appendChild(body);
  return section;
}

function getWeekBadgeClass(weekNum) {
  const completion = getWeekCompletion(weekNum);
  if (weekNum === 1) return 'active';
  if (isKeyWeek(weekNum)) return 'key';
  if (completion === 'full') return 'collected';
  if (completion === 'partial') return 'partial-bg';
  return 'default';
}

function renderWeekFiles(week) {
  const wrap = document.createElement('div');
  wrap.className = 'week-files';
  wrap.id = 'week-files-' + week.num;
  const files = filesOf(week.num);

  let listHTML = '';
  if (files.length === 0) {
    listHTML = '<div class="week-files-empty">📄 ' + t('weekFilesEmpty') + '</div>';
  } else {
    listHTML = files.map((f, idx) =>
      '<div class="week-file-item"><span class="week-file-name" title="' + esc(f.filename) + '">📄 ' + esc(f.filename) + '</span>' +
      '<span class="week-file-remove" data-w="' + week.num + '" data-idx="' + idx + '">×</span></div>'
    ).join('');
  }

  wrap.innerHTML =
    '<div class="week-files-header">' +
    '  <span class="week-files-title">' + t('weekFilesTitle') + '</span>' +
    (files.length > 0 ? '<span class="week-files-count">' + files.length + ' file' + (files.length > 1 ? 's' : '') + '</span>' : '') +
    '</div>' +
    '<div class="week-files-list">' + listHTML + '</div>' +
    '<button class="week-files-add">' + t('weekFilesAdd') + '</button>';

  // remove file
  wrap.querySelectorAll('.week-file-remove').forEach(btn => {
    btn.onclick = function(e) {
      e.stopPropagation();
      const w = parseInt(this.dataset.w), idx = parseInt(this.dataset.idx);
      const removed = appState.materials[w].files[idx].filename;
      appState.materials[w].files.splice(idx, 1);
      saveState();
      showToast(t('removed').replace('{f}', removed));
      refreshAll();
    };
  });

  // add files (click)
  wrap.querySelector('.week-files-add').onclick = function(e) {
    e.stopPropagation();
    const input = document.createElement('input');
    input.type = 'file'; input.multiple = true;
    input.accept = '.pdf,.pptx,.ppt,.docx,.doc';
    input.onchange = function() {
      for (const f of input.files) addFileToWeek(week.num, f.name, false);
      refreshAll();
    };
    input.click();
  };

  // drag & drop onto the area
  wrap.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); this.classList.add('drag-over'); });
  wrap.addEventListener('dragleave', function(e) { this.classList.remove('drag-over'); });
  wrap.addEventListener('drop', function(e) {
    e.preventDefault(); e.stopPropagation(); this.classList.remove('drag-over');
    for (const f of e.dataTransfer.files) addFileToWeek(week.num, f.name, false);
    refreshAll();
  });
  return wrap;
}

function renderModuleTabs(week) {
  const tabs = document.createElement('div');
  tabs.className = 'module-tabs';
  tabs.id = 'tabs-' + week.num;
  const active = (appState.activeTabs && appState.activeTabs[week.num]) || 'exercise';
  const contentMap = { exercise: hasExercise(week), knowledge: hasKnowledge(week), reading: hasReading(week), quiz: hasQuiz(week) };
  t('tabs').forEach(tab => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (tab.key === active ? ' active' : '') + (contentMap[tab.key] ? ' has-content' : '');
    btn.dataset.module = tab.key;
    btn.innerHTML = '<span class="tab-ico">' + tab.ico + '</span>' + tab.label;
    btn.onclick = function() { setActiveTab(week.num, tab.key); };
    tabs.appendChild(btn);
  });
  return tabs;
}

function renderModulePanels(week) {
  const host = document.createElement('div');
  const active = (appState.activeTabs && appState.activeTabs[week.num]) || 'exercise';
  const modules = ['exercise', 'knowledge', 'reading', 'quiz'];
  modules.forEach(m => {
    const panel = document.createElement('div');
    panel.className = 'module-panel' + (m === active ? ' active' : '');
    panel.id = 'panel-' + week.num + '-' + m;
    if (week.num === 1) renderW1Panel(m, panel);
    else renderPlaceholderPanel(m, week, panel);
    host.appendChild(panel);
  });
  return host;
}

function setActiveTab(weekNum, moduleKey) {
  if (!appState.activeTabs) appState.activeTabs = {};
  appState.activeTabs[weekNum] = moduleKey;
  saveState();
  const tabsHost = document.getElementById('tabs-' + weekNum);
  if (tabsHost) {
    tabsHost.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.module === moduleKey));
  }
  ['exercise', 'knowledge', 'reading', 'quiz'].forEach(m => {
    const p = document.getElementById('panel-' + weekNum + '-' + m);
    if (p) p.classList.toggle('active', m === moduleKey);
  });
}

function openWeek(weekNum) {
  const el = document.getElementById('week-' + weekNum);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (!el.classList.contains('expanded')) {
      el.classList.add('expanded');
      hydrateNotes(weekNum, el);
    }
  }
}

function openWeekTab(weekNum, moduleKey) {
  openWeek(weekNum);
  setTimeout(() => setActiveTab(weekNum, moduleKey), 60);
}

// ---------------- QUIZ PANEL ----------------
function renderQuizPanel(weekNum, panel) {
  const quiz = WEEK_QUIZ[weekNum];
  if (!quiz) {
    panel.innerHTML = '<div class="quiz-placeholder">' +
      '<span class="ph-ico">📝</span>' +
      '<strong>' + t('quizComingTitle') + '</strong><br>' + t('quizComingBody') +
      '</div>';
    return;
  }
  const st = appState.quizState[weekNum] || { mcq: {}, short: {}, revealed: {} };
  appState.quizState[weekNum] = st;

  let h = '';
  h += '<div class="quiz-banner">' +
    '<div class="quiz-banner-text">' + t('quizReadyTitle').replace('{w}', weekNum) + '<br><span style="font-weight:400;font-size:12px;">' + t('quizReadySub') + '</span></div>' +
    '<div style="display:flex;align-items:center;gap:10px;">' +
    '  <span class="quiz-score" id="quizScore-' + weekNum + '"></span>' +
    '  <button class="btn btn-sm" onclick="retakeQuiz(' + weekNum + ')">' + t('quizRetake') + '</button>' +
    '</div></div>';

  // MCQs
  h += '<h4 style="margin:4px 0 10px;font-size:13px;color:var(--text-soft);">' + t('quizMCQTitle') + '</h4>';
  quiz.mcq.forEach((q, qi) => {
    h += '<div class="mcq-q">';
    h += '<div class="mcq-q-title">' + (qi + 1) + '. ' + bi(q.q) + '</div>';
    q.options.forEach((op, oi) => {
      const sel = st.mcq[qi];
      let cls = 'mcq-option';
      if (sel !== undefined) {
        cls += ' disabled';
        if (oi === q.answer) cls += ' correct';
        else if (oi === sel) cls += ' wrong';
      } else if (sel === undefined) { /* idle */ }
      h += '<button class="' + cls + '" data-w="' + weekNum + '" data-q="' + qi + '" data-o="' + oi + '">' +
        '<span class="opt-key">' + 'ABCD'[oi] + '</span><span>' + bi(op) + '</span></button>';
    });
    h += '<div class="mcq-explain" id="mcqEx-' + weekNum + '-' + qi + '">💡 ' + bi(q.explain) + '</div>';
    h += '</div>';
  });

  // Short answers
  h += '<h4 style="margin:16px 0 10px;font-size:13px;color:var(--text-soft);">' + t('quizShortTitle') + '</h4>';
  quiz.short.forEach((q, qi) => {
    h += '<div class="short-q">';
    h += '<div class="short-q-title">' + (quiz.mcq.length + qi + 1) + '. ' + bi(q.q) + '</div>';
    h += '<textarea id="shortIn-' + weekNum + '-' + qi + '" placeholder="' + (lang === 'zh' ? '先自己写，再对照参考答案...' : 'Answer first, then compare with the model answer...') + '"></textarea>';
    h += '<button class="model-toggle" id="modelBtn-' + weekNum + '-' + qi + '" onclick="toggleModel(' + weekNum + ',' + qi + ')">' + (st.revealed[qi] ? t('hideModel') : t('showModel')) + '</button>';
    h += '<div class="model-answer" id="modelAns-' + weekNum + '-' + qi + '"><strong>' + (lang === 'zh' ? '参考答案' : 'Model answer') + '</strong>' + bi(q.model) + '</div>';
    h += '</div>';
  });

  panel.innerHTML = h;

  // restore state
  quiz.mcq.forEach((q, qi) => {
    const ta = document.getElementById('shortIn-' + weekNum + '-' + qi);
    if (ta) ta.value = st.short[qi] || '';
    if (st.revealed[qi]) {
      const ma = document.getElementById('modelAns-' + weekNum + '-' + qi);
      if (ma) ma.classList.add('show');
    }
  });
  updateQuizScore(weekNum);

  // bind MCQ clicks
  panel.querySelectorAll('.mcq-option:not(.disabled)').forEach(btn => {
    btn.onclick = function() { answerMcq(weekNum, parseInt(this.dataset.q), parseInt(this.dataset.o)); };
  });
  // bind short answer save
  quiz.short.forEach((q, qi) => {
    const ta = document.getElementById('shortIn-' + weekNum + '-' + qi);
    if (ta) ta.addEventListener('input', function() {
      st.short[qi] = this.value;
      saveState();
    });
  });
}

function answerMcq(weekNum, qi, oi) {
  const quiz = WEEK_QUIZ[weekNum];
  const st = appState.quizState[weekNum] || {};
  st.mcq = st.mcq || {};
  st.mcq[qi] = oi;
  appState.quizState[weekNum] = st;
  saveState();

  const q = quiz.mcq[qi];
  const panel = document.getElementById('panel-' + weekNum + '-quiz');
  const qEl = panel.querySelectorAll('.mcq-q')[qi];
  const opts = qEl.querySelectorAll('.mcq-option');
  opts.forEach((btn, idx) => {
    btn.classList.add('disabled');
    btn.classList.remove('selected');
    if (idx === q.answer) btn.classList.add('correct');
    else if (idx === oi) btn.classList.add('wrong');
  });
  const ex = document.getElementById('mcqEx-' + weekNum + '-' + qi);
  if (ex) ex.classList.add('show');
  updateQuizScore(weekNum);
}

function updateQuizScore(weekNum) {
  const quiz = WEEK_QUIZ[weekNum];
  const st = appState.quizState[weekNum];
  const el = document.getElementById('quizScore-' + weekNum);
  if (!el) return;
  if (!st || !st.mcq) return;
  const answered = Object.keys(st.mcq).length;
  if (answered === 0) { el.textContent = ''; return; }
  let correct = 0;
  quiz.mcq.forEach((q, qi) => { if (st.mcq[qi] === q.answer) correct++; });
  el.textContent = t('quizScore').replace('{n}', correct).replace('{t}', quiz.mcq.length);
  const pct = correct / quiz.mcq.length;
  el.style.color = pct >= 0.6 ? 'var(--green)' : pct >= 0.4 ? 'var(--amber)' : 'var(--red)';
}

function retakeQuiz(weekNum) {
  if (!confirm(lang === 'zh' ? '清空本周 Quiz 作答记录并重新开始？' : 'Clear this week\'s quiz answers and start over?')) return;
  appState.quizState[weekNum] = { mcq: {}, short: {}, revealed: {} };
  saveState();
  const panel = document.getElementById('panel-' + weekNum + '-quiz');
  renderQuizPanel(weekNum, panel);
}

function toggleModel(weekNum, qi) {
  const st = appState.quizState[weekNum];
  st.revealed[qi] = !st.revealed[qi];
  saveState();
  const ma = document.getElementById('modelAns-' + weekNum + '-' + qi);
  const btn = document.getElementById('modelBtn-' + weekNum + '-' + qi);
  if (ma) ma.classList.toggle('show');
  if (btn) btn.textContent = st.revealed[qi] ? t('hideModel') : t('showModel');
}

// ---------------- PLACEHOLDER PANELS (weeks 2-13) ----------------
function renderPlaceholderPanel(moduleKey, week, panel) {
  if (moduleKey === 'quiz') {
    panel.innerHTML = '<div class="quiz-placeholder">' +
      '<span class="ph-ico">📝</span>' +
      '<strong>' + t('quizComingTitle') + '</strong><br>' + t('quizComingBody') +
      '</div>';
  } else {
    panel.innerHTML = '<div class="content-placeholder">' +
      '<span class="ph-ico">📚</span>' +
      '<strong>' + t('placeholderTitle') + '</strong><br>' +
      t('placeholderBody').replace('{w}', week.num) +
      '</div>';
  }
}

// ---------------- NOTES ----------------
function renderNotesBlock(weekNum) {
  const wrapper = document.createElement('div');
  wrapper.style.marginTop = '16px';
  const hint = document.createElement('div');
  hint.className = 'notes-hint';
  hint.textContent = t('notesHint');
  wrapper.appendChild(hint);
  const textarea = document.createElement('textarea');
  textarea.className = 'notes-area';
  textarea.placeholder = t('notesPlaceholder');
  textarea.dataset.week = weekNum;
  textarea.value = appState.notes[weekNum] || '';
  let saveTimeout;
  textarea.addEventListener('input', function() {
    clearTimeout(saveTimeout);
    const indicator = wrapper.querySelector('.save-indicator');
    saveTimeout = setTimeout(() => {
      appState.notes[weekNum] = this.value;
      saveState();
      if (indicator) { indicator.classList.add('visible'); setTimeout(() => indicator.classList.remove('visible'), 2000); }
    }, 500);
  });
  wrapper.appendChild(textarea);
  const indicator = document.createElement('span');
  indicator.className = 'save-indicator';
  indicator.textContent = t('saved');
  wrapper.appendChild(indicator);
  return wrapper;
}

function hydrateNotes(weekNum, section) {
  const ta = section.querySelector('.notes-area');
  if (ta && ta.value === '') ta.value = appState.notes[weekNum] || '';
}

// ---------------- HERO STEPS ----------------
function toggleHeroStep(key, el) {
  if (!appState.stepCompletion) appState.stepCompletion = {};
  appState.stepCompletion[key] = !appState.stepCompletion[key];
  saveState();
  const check = el.querySelector('.step-check');
  if (check) check.classList.toggle('checked', appState.stepCompletion[key]);
}

// ---------------- PROGRESS ----------------
function refreshProgress() {
  const ring = document.getElementById('progressRing');
  if (!ring) return;
  const collected = getCollectedCount();
  ring.textContent = collected + '/13';
  const pct = collected / 13;
  if (pct >= 0.5) { ring.style.borderColor = 'var(--green)'; ring.style.color = 'var(--green)'; }
  else if (pct > 0) { ring.style.borderColor = 'var(--amber)'; ring.style.color = 'var(--amber)'; }
  else { ring.style.borderColor = '#cbd5e1'; ring.style.color = 'var(--text-muted)'; }
}

// ---------------- DROPZONE / LANG BINDINGS ----------------
function bindDropzone() {
  const dropzone = document.getElementById('mainDropzone');
  const fileInput = document.getElementById('fileInput');
  if (!dropzone || !fileInput) return;
  dropzone.onclick = () => fileInput.click();
  fileInput.onchange = () => { handleFiles(fileInput.files); fileInput.value = ''; };
  dropzone.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', function(e) { this.classList.remove('drag-over'); });
  dropzone.addEventListener('drop', function(e) { e.preventDefault(); this.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });
  document.addEventListener('paste', function(e) { const files = e.clipboardData.files; if (files.length > 0) handleFiles(files); });
}

function bindLangBtn() {
  const btn = document.getElementById('langBtn');
  if (btn) {
    btn.onclick = function() {
      lang = lang === 'zh' ? 'en' : 'zh';
      saveState();
      renderApp();
    };
  }
}

function refreshAll() {
  renderApp();
}

// ================================================================
//                         GLOBAL ACTIONS
// ================================================================
function resetAll() {
  if (!confirm(lang === 'zh' ? '确定要清除所有数据吗？（包括材料记录、笔记和 Quiz 作答）此操作不可撤销。' : 'Clear all data (materials, notes, quiz answers)? This cannot be undone.')) return;
  localStorage.removeItem(STORAGE_KEY);
  appState = getDefaultState();
  saveState();
  refreshAll();
  showToast(lang === 'zh' ? '已全部重置' : 'All reset');
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ================================================================
//                       VISIT COUNTER
// ================================================================
(function trackVisit() {
  const NS = 'hd6002-zhouxiang';
  const KEY = 'studyhub-visits';
  const API_BASE = 'https://api.countapi.xyz';
  const display = document.getElementById('visitDisplay');
  if (!display) return;
  fetch(API_BASE + '/hit/' + NS + '/' + KEY)
    .then(r => { if (!r.ok) throw new Error('hit failed'); return r.json(); })
    .then(d => { display.textContent = d.value + ' visits'; })
    .catch(() => {
      fetch(API_BASE + '/get/' + NS + '/' + KEY)
        .then(r => r.json())
        .then(d => { display.textContent = d.value + ' visits'; })
        .catch(() => {
          fetch(API_BASE + '/create?namespace=' + NS + '&key=' + KEY + '&value=0&update_lowerbound=0&update_upperbound=1000000')
            .then(() => fetch(API_BASE + '/hit/' + NS + '/' + KEY))
            .then(r => r.json())
            .then(d => { display.textContent = d.value + ' visits'; })
            .catch(() => { display.textContent = 'visits: —'; });
        });
    });
})();

// ================================================================
//                         INIT
// ================================================================
renderApp();
</script>
